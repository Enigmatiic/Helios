[package]
name = "helios"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "helios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] } # Tauri framework
tauri-plugin-opener = "2" # Open files and URLs
tauri-plugin-global-shortcut = "2" # Register global shortcutsserde = { version = "1", features = ["derive"] } # Serialization/deserialization
serde_json = "1" # JSON serialization/deserialization
cpal = "0.15.0" # Audio input/output
hound = "3.5" # Encode audio files [Wav]
reqwest = { version = "0.11.12", features = ["json", "multipart"] } # HTTP client
arboard = "3.2" # Clipboard access
tokio = { version = "1", features = ["full"] } # Async runtime
dotenv = "0.15"
enigo = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
